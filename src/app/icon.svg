<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="colortag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8B5CF6" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer rounded background -->
  <rect width="32" height="32" rx="8" fill="#0B0D17"/>
  <rect width="32" height="32" rx="8" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Palette / Color Tag Symbol -->
  <g filter="url(#glow)">
    <circle cx="16" cy="16" r="10" fill="url(#colortag-grad)"/>
    <!-- Palette paint dots -->
    <circle cx="13" cy="13" r="1.8" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="19" cy="13" r="1.8" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="19.5" cy="18" r="1.8" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Thumb hole -->
    <circle cx="13.5" cy="18.5" r="2.2" fill="#0B0D17"/>
  </g>
</svg>
